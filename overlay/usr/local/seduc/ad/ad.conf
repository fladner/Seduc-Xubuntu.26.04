# Configuração do ingresso no Active Directory SEDUC (lido pelo ingressar_ad.sh e
# pelo painel_ad.sh). Os modelos de arquivo ficam nesta mesma pasta.
DOMINIO="seduc.ce.gov.br"
REALM="SEDUC.CE.GOV.BR"
WORKGROUP="SEDUC"

# Grupos do AD com sudo (um por linha no sudoers; espaço vira "\ ")
GRUPOS_ADMIN=("domain admins" "astin_suporte")

# Impressora compartilhada no servidor Windows, para todas as máquinas.
# Formato \\servidor\fila (vazio = o painel pergunta). Driver: um "lpinfo -m".
IMPRESSORA=""
IMPRESSORA_NOME="SEDUC"
IMPRESSORA_DRIVER="drv:///sample.drv/generpcl.ppd"
