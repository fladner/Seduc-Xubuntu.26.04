# Gerado pelo ingressar_ad.sh a partir de /usr/local/seduc/ad/krb5.conf
[libdefaults]
        default_realm = @REALM@
        dns_lookup_realm = false
        dns_lookup_kdc = true
        rdns = false
        ticket_lifetime = 24h
        renew_lifetime = 7d
        forwardable = true

[domain_realm]
        .@DOMINIO@ = @REALM@
        @DOMINIO@ = @REALM@
