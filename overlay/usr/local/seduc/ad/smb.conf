# Gerado pelo ingressar_ad.sh a partir de /usr/local/seduc/ad/smb.conf
# (baseado no smb.conf da imagem SEDUC 20.04, sem as opções que o Samba 4.2x
# não usa mais: read/write raw, wins, socket options, NT1)
[global]
        security = ads
        realm = @REALM@
        workgroup = @WORKGROUP@
        netbios name = @NETBIOS@
        kerberos method = secrets and keytab

        idmap config * : backend = autorid
        idmap config * : range = 1000000 - 19999999
        idmap config * : rangesize = 1000000

        winbind enum users = yes
        winbind enum groups = yes
        winbind use default domain = yes
        winbind nested groups = yes
        winbind cache time = 86400
        winbind refresh tickets = yes
        winbind offline logon = yes

        template homedir = /home/%U
        template shell = /bin/bash

        client min protocol = SMB2
        client max protocol = SMB3
        name resolve order = lmhosts host wins bcast
        restrict anonymous = 2
