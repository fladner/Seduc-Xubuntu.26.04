menuentry "Experimentar ou instalar o Xubuntu SEDUC" {
    set gfxpayload=keep
    linux  /casper/vmlinuz  iso-scan/filename=${iso_path} --- quiet splash
    initrd /casper/initrd
}
menuentry "Experimentar ou instalar o Xubuntu SEDUC (modo de vídeo seguro)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz nomodeset  iso-scan/filename=${iso_path} --- quiet splash
    initrd /casper/initrd
}
