set timeout=30

loadfont /boot/grub/fonts/unicode.pf2
insmod gfxterm
terminal_output gfxterm

set gfxmode=auto
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Experimentar ou instalar o Xubuntu SEDUC" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  --- quiet splash
	initrd	/casper/initrd
}
menuentry "Experimentar ou instalar o Xubuntu SEDUC (modo de vídeo seguro)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz nomodeset  --- quiet splash
	initrd	/casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Iniciar pelo próximo dispositivo' {
	exit 1
}
menuentry 'Configurações do firmware UEFI' {
	fwsetup
}
else
menuentry 'Testar a memória' {
	linux16 /boot/memtest86+x64.bin
}
fi
